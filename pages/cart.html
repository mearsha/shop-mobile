
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید | موبایل‌شاپ</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">

    <script src="../js/header.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/cart.js" defer></script>
</head>
<body>

    <div id="siteHeader"></div>

    <main class="container cart-page">
        <h1>سبد خرید من 🛒</h1>
        <p class="cart-subtitle">محصولات انتخاب‌شده توسط شما</p>

        <div class="cart-layout">
            <section id="cartItems" class="cart-items">
                <p>در حال بارگذاری سبد خرید...</p>
            </section>

            <aside class="cart-summary">
                <h2>خلاصه سفارش</h2>

                <div class="summary-row">
                    <span>تعداد محصولات:</span>
                    <strong id="cartTotalItems">۰</strong>
                </div>

                <div class="summary-row">
                    <span>مبلغ کل:</span>
                    <strong id="cartTotalPrice">۰ تومان</strong>
                </div>

                <button id="checkoutBtn" class="checkout-btn">
                    ادامه فرایند خرید
                </button>

                <a href="products.html" class="continue-shopping">
                    ادامه خرید
                </a>
            </aside>
        </div>
    </main>

    <div id="siteFooter"></div>

</body>
</html>
